    <path d="M493 182c-2-18 10-30 25-30 15 0 25 10 22 30-4-9-9-14-22-15-12 0-20 5-25 15z" fill="#2B2118"/>
    <circle cx="508" cy="186" r="2" fill="#2B2118"/>
