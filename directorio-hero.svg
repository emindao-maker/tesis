<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-label="Palacio de justicia, balanza, libros y un abogado con maletín">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
